name: Test and deploy

# Every branch push runs the tests; only master deploys. master is protected and
# requires the `test` check, so changes reach it through a pull request (`yarn ship`).
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push to the same branch replaces a run still in progress, except on master,
# where every merge should finish deploying
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Same Node as local development; Astro 7.4.2 needs 22.23.4 or newer
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn build
      # End-to-end and axe checks against the built site
      - run: yarn playwright install --with-deps chromium
      - run: yarn playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
      - if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
